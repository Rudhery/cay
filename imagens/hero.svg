.o1{animation:d1 14s ease-in-out infinite alternate} .o2{animation:d2 18s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(160px,40px)}} @keyframes d2{to{transform:translate(-180px,-30px)}}
