<title id="t">O gato do Cay</title><desc id="d">Três estados do gato: dormindo (respira devagar, solta zzz), acordado (balança e olha em volta) e curioso (inclina a cabeça, mexe a orelha e acende o pontinho roxo). Embaixo, a ilha em cada estado.</desc>
