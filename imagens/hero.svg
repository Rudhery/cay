<title id="t">O Cay aberto: o player de música</title><desc id="d">A ilha expandida mostrando a música que está tocando, com capa, título, progresso, controles e o gato balançando no ritmo. Anotações explicam como cada parte se move. Abaixo, o Theme.cs com as molas.</desc>
